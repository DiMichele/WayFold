# WayFold — reverse proxy verso Node (porta 3000)
# Installazione: sudo cp deploy/nginx-wayfold.conf /etc/nginx/sites-enabled/wayfold
#                sudo nginx -t && sudo systemctl reload nginx

server {
    server_name wayfold.xyz www.wayfold.xyz 167.233.121.159;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/wayfold.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wayfold.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.wayfold.xyz) {
        return 301 https://$host$request_uri;
    }
    if ($host = wayfold.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name wayfold.xyz www.wayfold.xyz 167.233.121.159;
    return 404;
}
