# WayFold Compliance — reverse proxy
# Target: compliance.wayfold.xyz
#   /        → CISO frontend :13000
#   /api/    → CISO backend  :18000
#   /wayfold/→ WayFold engine :18092
#
# Install (as root):
#   cp deploy/nginx-compliance.conf /etc/nginx/sites-available/compliance
#   ln -sf /etc/nginx/sites-available/compliance /etc/nginx/sites-enabled/compliance
#   certbot --nginx -d compliance.wayfold.xyz
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name compliance.wayfold.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compliance.wayfold.xyz;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # WayFold consultant engine (branded UX)
    location /wayfold/ {
        proxy_pass http://127.0.0.1:18092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # CISO API
    location /api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # CISO UI
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Certbot fills these on first run; placeholders keep nginx -t happy before cert exists
    ssl_certificate /etc/letsencrypt/live/compliance.wayfold.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compliance.wayfold.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
